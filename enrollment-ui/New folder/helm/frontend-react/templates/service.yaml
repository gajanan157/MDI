apiVersion: v1
kind: Service
metadata:
  name: {{ include "frontend-react.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "frontend-react.name" . }}
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      protocol: TCP
    {{- end }}
