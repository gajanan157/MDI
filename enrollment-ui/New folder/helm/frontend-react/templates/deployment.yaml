apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frontend-react.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "frontend-react.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "frontend-react.name" . }}
    spec:
      containers:
        - name: frontend-react
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443

          # 🔥 NEW ENV BLOCK
          env:
          {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
          {{- end }}

          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true

          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: https
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
{{ toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tlsSecret }}